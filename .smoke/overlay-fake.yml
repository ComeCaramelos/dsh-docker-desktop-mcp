# Smoke overlay using a fake docker shim so we can observe discovered profiles
# and the exact gateway args after a profile switch.
# `name` anchors beside this file; `command` resolves from the dsh launch cwd
# (repo root).
# NOTE (component model): a row standing on its own never spawns and never
# runs discovery — without a manager mounted the entry stays pending, so this
# overlay answers only the inert path. To observe argv or a gateway spawn,
# boot `overlay-manager.yml` (same shape, plus a seeded docker-profile entry).

- insert:
    - id: mcp-docker
      name: '../lib/index.js'
      config:
        serverName: docker
        profile: default
        command: .smoke/fake-docker
